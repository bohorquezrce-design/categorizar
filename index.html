<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Categorizar consumos</title>
<style>
  :root { --bg:#f4f6fa; --card:#fff; --tx:#1b2333; --mut:#6b7486; --ac:#002A8D; --bd:#dfe4ee; --ok:#1d8a4a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1218; --card:#1a1f29; --tx:#e9edf5; --mut:#97a0b3; --ac:#6d93ff; --bd:#2b3240; --ok:#41c27a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:16px/1.4 -apple-system, system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px 16px 140px; }
  h1 { font-size:20px; margin:4px 0 4px; }
  p.sub { color:var(--mut); margin:0 0 14px; font-size:14px; }
  .todos { display:flex; gap:8px; align-items:center; background:var(--card); border:1px solid var(--bd);
           border-radius:12px; padding:10px 12px; margin-bottom:12px; font-size:14px; }
  .todos select { flex:1; }
  .item { background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
  .fila { display:flex; justify-content:space-between; gap:8px; }
  .com { font-weight:600; overflow-wrap:anywhere; }
  .meta { color:var(--mut); font-size:14px; white-space:nowrap; }
  select { width:100%; margin-top:8px; font-size:16px; padding:8px; border-radius:8px; border:1px solid var(--bd);
           background:var(--bg); color:var(--tx); }
  .item.falta select { border-color:#d9822b; }
  .item.elim .com { text-decoration:line-through; color:var(--mut); }
  footer { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--bd);
           padding:10px 16px calc(10px + env(safe-area-inset-bottom)); }
  footer .in { max-width:560px; margin:0 auto; }
  #codigo { font:14px ui-monospace, Menlo, monospace; color:var(--mut); margin-bottom:8px; overflow-wrap:anywhere; }
  .btns { display:flex; gap:8px; }
  .btns a, .btns button { flex:1; text-align:center; padding:12px; border-radius:10px; font-size:16px; font-weight:600;
           text-decoration:none; border:0; }
  #enviar { background:var(--ac); color:#fff; }
  #copiar { background:var(--bg); color:var(--tx); border:1px solid var(--bd); }
  .vacio { text-align:center; color:var(--mut); margin-top:40px; }
</style>
</head>
<body>
<main>
  <h1>Categorizar consumos</h1>
  <p class="sub" id="sub"></p>
  <div class="todos" id="todosBox" hidden>
    <span>Los que faltan →</span>
    <select id="todos"></select>
  </div>
  <div id="lista"></div>
</main>
<footer id="pie" hidden>
  <div class="in">
    <div id="codigo"></div>
    <div class="btns">
      <button id="copiar" type="button">Copiar</button>
      <a id="enviar" href="#">Enviar por iMessage</a>
    </div>
  </div>
</footer>
<script>
(function () {
  var AGENTE = "+18583429101";
  var CATS = [["C","Casita"],["K","Comida casita"],["A","Comida afuera"],["P","Perrhijos"],["M","Compras"],
    ["U","Cuidado personal"],["F","Fijos"],["R","Regalos"],["S","Salud"],["E","Entretenimiento"],
    ["V","Viajes"],["T","Transporte"],["B","Bebé"],["G","Gastos Iniciales"]];
  var items = [];
  var h = location.hash.slice(1);
  if (h) h.split("!").forEach(function (p) {
    var f = p.split("~").map(function (x) { try { return decodeURIComponent(x); } catch (e) { return x; } });
    if (f.length >= 4 && /^\d+$/.test(f[0])) items.push({ n: +f[0], fecha: f[1], com: f[2], monto: f[3], sug: f[4] || "" });
  });
  var lista = document.getElementById("lista");
  if (!items.length) {
    lista.innerHTML = '<p class="vacio">No hay consumos en este link.</p>';
    return;
  }
  document.getElementById("sub").textContent = items.length + " consumo(s). Revisa la categoría de cada uno y toca «Enviar».";
  function opciones(sel, conVacio, textoVacio) {
    if (conVacio) sel.add(new Option(textoVacio, ""));
    CATS.forEach(function (c) { sel.add(new Option(c[1], c[0])); });
    sel.add(new Option("✕ No es gasto (eliminar)", "X"));
  }
  var sels = [];
  items.forEach(function (it) {
    var d = document.createElement("div");
    d.className = "item";
    var fila = document.createElement("div");
    fila.className = "fila";
    var c = document.createElement("div"); c.className = "com"; c.textContent = it.n + ") " + it.com;
    var m = document.createElement("div"); m.className = "meta"; m.textContent = it.fecha + " · " + it.monto;
    fila.appendChild(c); fila.appendChild(m); d.appendChild(fila);
    var s = document.createElement("select");
    opciones(s, true, "— elegir —");
    s.value = it.sug;
    s.addEventListener("change", actualizar);
    d.appendChild(s); lista.appendChild(d);
    sels.push({ it: it, s: s, d: d });
  });
  var todos = document.getElementById("todos");
  opciones(todos, true, "— poner a todos —");
  todos.addEventListener("change", function () {
    if (!todos.value) return;
    sels.forEach(function (x) { if (!x.s.value) x.s.value = todos.value; });
    todos.value = ""; actualizar();
  });
  function rangos(nums) {
    var out = [], i = 0;
    while (i < nums.length) {
      var j = i;
      while (j + 1 < nums.length && nums[j + 1] === nums[j] + 1) j++;
      out.push(j > i ? nums[i] + "-" + nums[j] : String(nums[i]));
      i = j + 1;
    }
    return out;
  }
  function actualizar() {
    var faltan = 0, cambios = {}, orden = [];
    sels.forEach(function (x) {
      var v = x.s.value;
      x.d.classList.toggle("falta", !v);
      x.d.classList.toggle("elim", v === "X");
      if (!v) { faltan++; return; }
      if (v !== x.it.sug) {
        if (!cambios[v]) { cambios[v] = []; orden.push(v); }
        cambios[v].push(x.it.n);
      }
    });
    var partes = [];
    orden.forEach(function (v) { rangos(cambios[v]).forEach(function (r) { partes.push(r + v); }); });
    var hayOk = sels.some(function (x) { return x.it.sug && x.s.value === x.it.sug; });
    var txt = (hayOk ? "ok" : "") + (hayOk && partes.length ? ", " : "") + partes.join(" ");
    document.getElementById("todosBox").hidden = faltan === 0;
    document.getElementById("pie").hidden = !txt;
    document.getElementById("codigo").textContent = "Respuesta: " + txt + (faltan ? "  (faltan " + faltan + ")" : "");
    document.getElementById("enviar").href = "sms:" + AGENTE + "&body=" + encodeURIComponent(txt);
    document.getElementById("copiar").onclick = function () {
      var b = this;
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function () {
        b.textContent = "Copiado ✓"; setTimeout(function () { b.textContent = "Copiar"; }, 1500);
      }, function () { prompt("Copia este texto:", txt); });
    };
  }
  actualizar();
})();
</script>
</body>
</html>
